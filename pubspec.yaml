name: exposure_counter
description: A private, offline-first Exposure and Response Prevention companion.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.12.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  go_router: ^18.1.1
  sqflite: ^2.4.5
  path: ^1.9.1
  uuid: ^4.6.0
  intl: ^0.20.2
  fl_chart: ^1.3.0
  share_plus: ^13.3.1
  path_provider: ^2.1.6
  local_auth: ^3.0.2
  shared_preferences: ^2.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  assets:
    - assets/branding/exposure_counter_mark.png

flutter_launcher_icons:
  android: true
  image_path: assets/branding/exposure_counter_mark.png
  adaptive_icon_background: '#0B2D55'
  adaptive_icon_foreground: assets/branding/exposure_counter_mark.png
